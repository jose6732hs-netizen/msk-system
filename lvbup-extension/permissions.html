<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Permissão de Microfone</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0a0d0f;
            color: white;
            margin: 0;
        }
        .card {
            background: #111518;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #3b82f633;
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #3b82f6; font-size: 20px; }
        p { color: #94a3b8; line-height: 1.5; }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Permissão Necessária</h1>
        <p>Para usar o reconhecimento de voz, precisamos de permissão para acessar seu microfone.</p>
        <button id="requestBtn" class="btn">Permitir Microfone</button>
    </div>
    <script src="permissions.js"></script>
</body>
</html>
