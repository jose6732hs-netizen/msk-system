name: Patch MSK Agent Fail Closed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-msk-agent-fail-closed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply fail-closed patch
        run: python3 scripts/patch-msk-agent-fail-closed.py

      - name: Verify patch
        run: |
          grep -Fq 'action === "preview-confirm"' supabase/functions/msk-agent/index.ts
          grep -Fq 'status: "verification_pending"' supabase/functions/msk-agent/index.ts
          grep -Fq 'preview_status: "healthy"' supabase/functions/msk-agent/index.ts
          ! grep -Fq 'return json({ ok: true, completed: true, preview_pending: true' supabase/functions/msk-agent/index.ts

      - name: Commit patch
        run: |
          git config user.name 'MSK Safe Build'
          git config user.email 'safe-build@msksystem.online'
          git add supabase/functions/msk-agent/index.ts
          git commit -m 'MSK: exigir preview saudável antes de concluir edição'
          git push origin HEAD:main

# trigger: fail-closed-v2
